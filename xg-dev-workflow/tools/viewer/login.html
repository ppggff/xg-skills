<!doctype html>
<html lang="zh-CN">
<head>
<!-- status viewer — the login page (059): what a shell route shows without a live login. The password goes to
     /api/login with the writes' header; the answer sets an HttpOnly cookie, and the page reloads into the viewer. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>status viewer · 登录</title>
<link rel="stylesheet" href="/assets/v2-themes.css">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--chrome); color: var(--tx); font: 400 14px/1.6 var(--cjk); }
  form { width: min(340px, calc(100vw - 32px)); background: var(--paper); border: 1px solid var(--ln); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 24px 22px 20px; }
  h1 { margin: 0 0 4px; font: 600 15px var(--mono); color: var(--ink); }
  p { margin: 0 0 16px; color: var(--mu); font-size: 12.5px; }
  input { box-sizing: border-box; width: 100%; height: 38px; padding: 0 12px; border: 1px solid var(--ln2); border-radius: var(--r-md); background: var(--chrome); color: var(--ink); font: inherit; outline: 0; }
  input:focus { border-color: var(--sig); }
  button { margin-top: 12px; width: 100%; height: 36px; border: 0; border-radius: var(--r-md); background: var(--sig); color: var(--paper); font: 600 13px var(--cjk); cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  .err { min-height: 1.6em; margin: 8px 0 0; color: var(--blocked); font-size: 12.5px; }
</style>
<script>
  try { var t = JSON.parse(localStorage.getItem("svd2-theme") || "\"\""); if (t) document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
</head>
<body>
<form id="f">
  <h1>status viewer</h1>
  <p>输入访问口令。登录后 7 天内免输，用着就一直有效。</p>
  <input id="pw" type="password" autocomplete="current-password" aria-label="访问口令" autofocus>
  <button id="go">登录</button>
  <div class="err" id="err" role="alert"></div>
</form>
<script>
  document.getElementById("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var go = document.getElementById("go"), err = document.getElementById("err"), pw = document.getElementById("pw");
    if (!pw.value) return pw.focus();
    go.disabled = true; err.textContent = "";
    fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json", "X-SV-Write": "1" }, body: JSON.stringify({ password: pw.value }) })
      .then(function (r) {
        if (r.ok) return location.reload();
        go.disabled = false; pw.select();
        err.textContent = r.status === 401 ? "口令不对。连续输错后每次要多等一会儿。" : "登录失败（" + r.status + "）";
      }, function () { go.disabled = false; err.textContent = "连不上 viewer"; });
  });
</script>
</body>
</html>
