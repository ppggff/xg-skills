<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Same policy as the classic shell, tightened: no inline script at all (the gitweb URL rides a meta),
     and the stylesheet comes from /assets. Nothing beyond 'self' is ever added. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="gitweb-url" content="__GITWEB_URL__">
<title>status viewer</title>
</head>
<body>
<script src="/assets/marked.min.js"></script>
<script src="/assets/sv.js"></script>
</body>
</html>
